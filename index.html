<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#15182e" />
  <title>Rusty Plumber</title>
  <link data-trunk rel="copy-dir" href="assets" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #15182e; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; image-rendering: pixelated; }
    .loader { position: fixed; inset: 0; display: grid; place-items: center; color: #fff1a6; letter-spacing: .08em; background: radial-gradient(circle at 50% 35%, #28356b, #15182e 60%); }
  </style>
</head>
<body>
  <canvas id="bevy-canvas" width="960" height="540"></canvas>
  <div class="loader">Loading Rusty Plumber…</div>
  <script>
    window.azzlePlaySound = (name) => {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = window.__rustyPlumberAudio ??= new AudioContext();
      if (ctx.state === 'suspended') ctx.resume();
      const tones = {
        jump: [520, 0.09, 'square'],
        coin: [880, 0.08, 'triangle'],
        hurt: [150, 0.16, 'sawtooth'],
        checkpoint: [660, 0.18, 'sine'],
        win: [740, 0.28, 'triangle'],
        stomp: [260, 0.10, 'square'],
      };
      const [freq, duration, type] = tones[name] || [440, 0.08, 'sine'];
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    };
    window.addEventListener('load',()=>setTimeout(()=>document.querySelector('.loader')?.remove(),1200));
  </script>
</body>
</html>
